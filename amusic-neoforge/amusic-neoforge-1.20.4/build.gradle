plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

// 模组文件名改为 AMusic
base {
    archivesName = "AMusic"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Cloth Config API 仓库（官方 maven）
repositories {
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    implementation "net.neoforged:neoforge:20.4.251"

    implementation project(":amusic-core")

    // Cloth Config API (NeoForge 1.20.4)
    // TODO: 1.20.4 可能需要 cloth-config 14.x 版本，如 15.0.140 不可用请调整为对应版本
    implementation "me.shedaniel.cloth:cloth-config-neoforge:15.0.140"
}

jar {
    dependsOn(":amusic-core:jar")
    // 把 amusic-core 模块的编译输出打包进最终 jar，否则运行时找不到 core 类
    from project(":amusic-core").sourceSets.main.output
    // 重复资源（如 icon.png）保留 neoforge 模块自己的版本
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'MixinConfigs': 'amusic.mixins.json'
    }
}
