plugins {
    id("net.fabricmc.fabric-loom") version "1.16.2"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Cloth Config API 仓库
repositories {
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    minecraft("com.mojang:minecraft:26.2")
    implementation("net.fabricmc:fabric-loader:0.19.3")
    implementation("net.fabricmc.fabric-api:fabric-api:0.155.2+26.2")

    // Cloth Config API (Fabric 26.2) - TODO: 确认 cloth-config 26.x 兼容版本
    modApi("me.shedaniel.cloth:cloth-config-fabric:19.0.144") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    implementation(project(":amusic-core"))
}

jar {
    dependsOn(":amusic-core:jar")
}
