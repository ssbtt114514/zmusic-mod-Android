plugins {
    id("fabric-loom") version "1.13.3"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Cloth Config API 仓库（官方 maven）
repositories {
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    minecraft("com.mojang:minecraft:1.20.4")
    mappings("net.fabricmc:yarn:1.20.4+build.3:v2")
    modImplementation("net.fabricmc:fabric-loader:0.14.21")
    modImplementation("net.fabricmc.fabric-api:fabric-api:0.97.3+1.20.4")

    // Cloth Config API (Fabric 1.20.4)
    modApi("me.shedaniel.cloth:cloth-config-fabric:14.0.126") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    implementation(project(":amusic-core"))
}

jar {
    dependsOn(":amusic-core:jar")
}