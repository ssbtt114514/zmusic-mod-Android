name: Dev Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**.java"
      - "**.gradle"
      - "**.json"
      - "**.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/dev.yml"
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    name: AMusic ${{ matrix.loader }} ${{ matrix.mc-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-26.2
            mc-version: "26.2"
            artifact-path: amusic-fabric/amusic-fabric-26.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-26.1.2
            mc-version: 26.1.2
            artifact-path: amusic-fabric/amusic-fabric-26.1.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-1.21.11
            mc-version: 1.21.11
            artifact-path: amusic-fabric/amusic-fabric-1.21.11/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-1.21.5
            mc-version: 1.21.5
            artifact-path: amusic-fabric/amusic-fabric-1.21.5/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-1.20.6
            mc-version: 1.20.6
            artifact-path: amusic-fabric/amusic-fabric-1.20.6/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-1.20.4
            mc-version: 1.20.4
            artifact-path: amusic-fabric/amusic-fabric-1.20.4/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-1.20.1
            mc-version: 1.20.1
            artifact-path: amusic-fabric/amusic-fabric-1.20.1/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: amusic-forge-1.20.4
            mc-version: 1.20.4
            artifact-path: amusic-forge/amusic-forge-1.20.4/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: amusic-forge-1.20.1
            mc-version: 1.20.1
            artifact-path: amusic-forge/amusic-forge-1.20.1/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: amusic-neoforge-26.2
            mc-version: "26.2"
            artifact-path: amusic-neoforge/amusic-neoforge-26.2/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: amusic-neoforge-26.1.2
            mc-version: 26.1.2
            artifact-path: amusic-neoforge/amusic-neoforge-26.1.2/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: amusic-neoforge-1.21.1
            mc-version: 1.21.1
            artifact-path: amusic-neoforge/amusic-neoforge-1.21.1/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: amusic-neoforge-1.20.6
            mc-version: 1.20.6
            artifact-path: amusic-neoforge/amusic-neoforge-1.20.6/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: amusic-neoforge-1.20.4
            mc-version: 1.20.4
            artifact-path: amusic-neoforge/amusic-neoforge-1.20.4/build/libs/**.jar
    steps:
      - uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/amusic-player
            builds/forge/.gradle/mavenizer
          key: ${{ runner.os }}-gradle-${{ matrix.project }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.project }}-
            ${{ runner.os }}-gradle-
      - name: Build ${{ matrix.loader }} ${{ matrix.mc-version }}
        run: |
          # 最多重试 3 次，应对 CI 中 maven 仓库偶发读取超时
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt"
            if ./gradlew --project-dir "${{ matrix.build-dir }}" ":${{ matrix.project }}:build" --no-daemon \
              -Pamusic.project="${{ matrix.project }}" \
              -Porg.gradle.java.installations.paths="$(mise where java@temurin-17),$(mise where java@temurin-21),$(mise where java@temurin-25)"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "Build attempt $attempt failed, retrying in 10s..."
              sleep 10
            fi
          done
          exit 1
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AMusic ${{ matrix.loader }} ${{ matrix.mc-version }}
          path: ${{ matrix.artifact-path }}
