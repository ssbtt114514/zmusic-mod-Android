    steps:
      - uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: artifact
      - name: Download Release Notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: release-notes
      - name: Publish to CurseForge and Modrinth
        env:
          MOD_LOADER: ${{ matrix.mod-loader }}
          MC_VERSION: ${{ matrix.target-version }}
          MC_VERSIONS: ${{ matrix.supported-versions }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_NAME: AMusic Android ${{ inputs.version || github.ref_name }} ${{ matrix.loader }} ${{ matrix.target-version }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          DRY_RUN: false
        run: |
          FILE_PATH="$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          if [ -z "$FILE_PATH" ]; then
            echo "No jar found in artifact" >&2
            find artifact -maxdepth 2 -type f -print >&2
            exit 1
          fi
          FILE_PATH="$(realpath "$FILE_PATH")"
          CHANGELOG="$(cat release-notes/release-notes.md)" \
            FILE_PATH="$FILE_PATH" \
            ./gradlew --project-dir builds/publish publishMarketplaceFile --no-daemon

  publish-release-mirrors:
    name: Publish Codeberg and CNB release
    runs-on: ubuntu-latest
    needs:
      - release
      - changelog
    if: ${{ inputs.dry-run != true && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Download Release Notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: release-notes
      - name: Publish to Codeberg and CNB
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_TAG: v${{ inputs.version || github.ref_name }}
          RELEASE_NAME: AMusic Android ${{ inputs.version || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CODEBERG_REPO: starhui-dev/amusic-mod
          CNB_REPO: starhui-dev/amusic-mod
          DRY_RUN: false
        run: |
          RELEASE_BODY="$(cat release-notes/release-notes.md)" \
            ARTIFACTS_DIR="$(realpath artifacts)" \
            ./gradlew --project-dir builds/publish publishReleaseMirrors --no-daemon
