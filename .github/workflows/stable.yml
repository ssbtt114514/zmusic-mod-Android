          - loader: Forge
            build-dir: builds/forge
            project: amusic-forge-1.12.2
            target-version: 1.12.2
            artifact-path: amusic-forge/amusic-forge-1.12.2/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: amusic-neoforge-26.2
            target-version: "26.2"
            artifact-path: amusic-neoforge/amusic-neoforge-26.2/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: amusic-neoforge-26.1.2
            target-version: 26.1.2
            artifact-path: amusic-neoforge/amusic-neoforge-26.1.2/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: amusic-neoforge-1.21.1
            target-version: 1.21.1
            artifact-path: amusic-neoforge/amusic-neoforge-1.21.1/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: amusic-neoforge-1.20.6
            target-version: 1.20.6
            artifact-path: amusic-neoforge/amusic-neoforge-1.20.6/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: amusic-neoforge-1.20.4
            target-version: 1.20.4
            artifact-path: amusic-neoforge/amusic-neoforge-1.20.4/build/libs/**.jar
    steps:
      - uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/amusic-player
            builds/forge/.gradle/mavenizer
          key: ${{ runner.os }}-gradle-${{ matrix.project }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.project }}-
            ${{ runner.os }}-gradle-
      - name: Warm Forge 1.12.2 classpath
        if: matrix.project == 'amusic-forge-1.12.2'
        run: |
          ./gradlew --project-dir "${{ matrix.build-dir }}" ":${{ matrix.project }}:dependencies" --configuration compileClasspath --no-daemon \
            -Pamusic.project="${{ matrix.project }}" \
            -Porg.gradle.java.installations.paths="$(mise where java@temurin-8),$(mise where java@temurin-16),$(mise where java@temurin-17),$(mise where java@temurin-21),$(mise where java@temurin-25)"
      - name: Build ${{ matrix.loader }} ${{ matrix.target-version }}
        run: |
          # 最多重试 3 次，应对 CI 中 maven 仓库偶发读取超时
          # 将 workflow 输入的版本号传给 Gradle，作为模组内部版本号（fabric.mod.json / mods.toml 中的 version）
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt"
            if ./gradlew --project-dir "${{ matrix.build-dir }}" ":${{ matrix.project }}:build" --no-daemon \
              -Pamusic.project="${{ matrix.project }}" \
              -Pamusic.version="${{ inputs.version }}" \
              -Porg.gradle.java.installations.paths="$(mise where java@temurin-8),$(mise where java@temurin-16),$(mise where java@temurin-17),$(mise where java@temurin-21),$(mise where java@temurin-25)"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "Build attempt $attempt failed, retrying in 10s..."
              sleep 10
            fi
          done
          exit 1
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AMusic ${{ matrix.loader }} ${{ matrix.target-version }}
          path: ${{ matrix.artifact-path }}

