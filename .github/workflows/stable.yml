          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-1.19.4
            target-version: 1.19.4
            artifact-path: amusic-fabric/amusic-fabric-1.19.4/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-1.19.2
            target-version: 1.19.2
            artifact-path: amusic-fabric/amusic-fabric-1.19.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-1.18.2
            target-version: 1.18.2
            artifact-path: amusic-fabric/amusic-fabric-1.18.2/build/libs/**.jar
          - loader: Fabric
