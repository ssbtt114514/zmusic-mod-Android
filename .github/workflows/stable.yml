name: Stable Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 3.7.1). A tag v<version> will be created and the release published under it.
        required: true
        type: string
      dry-run:
        description: Validate builds without creating release or tag (skips publishing)
        required: false
        default: false
        type: boolean

jobs:
  changelog:
    name: Extract release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: tag
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            # Fallback for non-manual triggers (e.g. tag push). Use ref name without leading 'v'.
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="0.0.0-untagged"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            scripts/extract-changelog.sh "${GITHUB_REF_NAME}" > release-notes.md
          else
            # Manual dispatch: use CHANGELOG.md section for the version, or fall back to commit log
            version="${{ steps.tag.outputs.version }}"
            if grep -q "^## v${version}\$" CHANGELOG.md; then
              # Extract section between this version header and the next '## ' header
              awk -v ver="## v${version}" '
                $0 == ver { found=1; next }
                found && /^## / { exit }
                found { print }
              ' CHANGELOG.md > release-notes.md
            else
              latest_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
              {
                printf 'Release notes for `%s`.\n\n' "v${version}"
                if [ -n "$latest_tag" ]; then
                  git log --pretty='- %s' "${latest_tag}..HEAD"
                else
                  git log --pretty='- %s'
                fi
              } > release-notes.md
            fi
          fi

          if [ ! -s release-notes.md ]; then
            echo "release notes are empty" >&2
            exit 1
          fi

          cat release-notes.md
      - name: Upload Release Notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: AMusic ${{ matrix.loader }} ${{ matrix.target-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-26.2
            target-version: "26.2"
            artifact-path: amusic-fabric/amusic-fabric-26.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-26.1.2
            target-version: 26.1.2
            artifact-path: amusic-fabric/amusic-fabric-26.1.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-1.21.11
            target-version: 1.21.11
            artifact-path: amusic-fabric/amusic-fabric-1.21.11/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: amusic-fabric-1.21.5
            target-version: 1.21.5
            artifact-path: amusic-fabric/amusic-fabric-1.21.5/build/libs/**.jar
          - loader: Fabric
