    if: ${{ inputs.dry-run != true && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release tag
        id: tag
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Download Release Notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: release-notes
      - name: Create tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}" 2>/dev/null || true
          git push origin "${{ steps.tag.outputs.tag }}" 2>/dev/null || true
      - name: Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: AMusic Android ${{ steps.tag.outputs.version }}
