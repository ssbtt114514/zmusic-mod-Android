plugins {
    id("net.neoforged.gradle.userdev") version "7.1.38" apply false
}

ext {
    modDescription = "Powerful Music System"
}

def isNeoForgeProject(Project p) {
    return p.name ==~ /zmusic-neoforge-\d+.*/
}

allprojects {
    repositories {
        maven {
            name = 'AliYunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        maven {
            name = 'AliYunCentral'
            url = 'https://maven.aliyun.com/repository/central'
        }
        maven {
            name = 'HuaweiCloud'
            url = 'https://mirrors.huaweicloud.com/repository/maven/'
        }
        mavenCentral()
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'Jitpack'
            url = 'https://jitpack.io'
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases/"
        }
    }
}

subprojects {
    apply plugin: 'java-library'

    group = "me.zhenxin"
    // 模组版本号：优先从 -Pzmusic.version 读取（CI 发布时由 workflow 输入传入），否则回退到默认
    version = project.hasProperty('zmusic.version') ? project.getProperty('zmusic.version') : '3.7.1'

    // 产物命名：zmusic-neoforge-1.21.1 -> zmusic-android-neoforge-1.21.1
    base.archivesName = project.name.replace("zmusic-", "zmusic-android-")

    dependencies {
        compileOnly("org.projectlombok:lombok:1.18.46")
        annotationProcessor("org.projectlombok:lombok:1.18.46")
    }

    jar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        if (project.name != "zmusic-core") {
            from(project(":zmusic-core").sourceSets.main.output)
            // 打包 JLayer（纯 Java MP3 解码器）到最终 jar 中
            from {
                configurations.runtimeClasspath.collect {
                    if (it.name.contains("jlayer") || it.name.contains("tritonus")) {
                        it.isDirectory() ? it : zipTree(it)
                    }
                }
            }
        }

        from("${rootDir}/../../LICENSE")
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "description", rootProject.modDescription

        if (isNeoForgeProject(project)) {
            from(project(":zmusic-core").sourceSets.main.resources) {
                include("icon.png")
            }
        }

        filesMatching("META-INF/neoforge.mods.toml") {
            expand "version": project.version, "description": rootProject.modDescription
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
