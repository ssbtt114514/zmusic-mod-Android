plugins {
    id("fabric-loom") version "1.13.3" apply false
    id("net.fabricmc.fabric-loom") version "1.16.2" apply false
}

ext {
    modDescription = "Music Player"
}

def isFabricProject(Project p) {
    return p.name ==~ /amusic-fabric-\d+.*/
}

allprojects {
    repositories {
        maven {
            name = 'AliYunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        maven {
            name = 'AliYunCentral'
            url = 'https://maven.aliyun.com/repository/central'
        }
        maven {
            name = 'HuaweiCloud'
            url = 'https://mirrors.huaweicloud.com/repository/maven/'
        }
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Jitpack'
            url = 'https://jitpack.io'
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases/"
        }
    }
}

subprojects {
    apply plugin: 'java-library'

    group = "me.ssbtt"
    // 模组版本号：优先从 -Pamusic.version 读取（CI 发布时由 workflow 输入传入），否则回退到默认
    version = project.hasProperty('amusic.version') ? project.getProperty('amusic.version') : '3.1'

    // 产物命名：amusic-fabric-1.20.1 -> amusic-android-fabric-1.20.1
    base.archivesName = project.name.replace("amusic-", "amusic-android-")

    dependencies {
        compileOnly("org.projectlombok:lombok:1.18.46")
        annotationProcessor("org.projectlombok:lombok:1.18.46")
    }

    jar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        if (project.name != "amusic-core") {
            from(project(":amusic-core").sourceSets.main.output)
            // 打包 JLayer（纯 Java MP3 解码器）到最终 jar 中
            from {
                configurations.runtimeClasspath.collect {
                    if (it.name.contains("jlayer") || it.name.contains("tritonus")) {
                        it.isDirectory() ? it : zipTree(it)
                    }
                }
            }
        }

        from("${rootDir}/../../LICENSE")
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "description", rootProject.modDescription

        if (isFabricProject(project)) {
            from(project(":amusic-core").sourceSets.main.resources) {
                include("icon.png")
            }
        }

        filesMatching("fabric.mod.json") {
            expand "version": project.version, "description": rootProject.modDescription
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
