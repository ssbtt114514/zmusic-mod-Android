pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "amusic-fabric"

include("amusic-core")
project(":amusic-core").projectDir = file("../../amusic-core")

def fabricProjects = [
        "amusic-fabric-1.14.4",
        "amusic-fabric-1.15.2",
        "amusic-fabric-1.16.5",
        "amusic-fabric-1.17.1",
        "amusic-fabric-1.18.2",
        "amusic-fabric-1.19.2",
        "amusic-fabric-1.19.4",
        "amusic-fabric-1.20.1",
        "amusic-fabric-1.20.4",
        "amusic-fabric-1.20.6",
        "amusic-fabric-1.21.5",
        "amusic-fabric-1.21.11",
        "amusic-fabric-26.1.2",
        "amusic-fabric-26.2"
]

def selectedProject = providers.gradleProperty("amusic.project").orNull
def selectedProjects = selectedProject ? [selectedProject] : fabricProjects

selectedProjects.each { projectName ->
    if (!fabricProjects.contains(projectName)) {
        throw new GradleException("Unknown Fabric project: ${projectName}")
    }
    include(projectName)
    project(":${projectName}").projectDir = file("../../amusic-fabric/${projectName}")
}
