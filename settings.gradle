pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "amusic-mod"

include("amusic-core")
include(
        "amusic-neoforge",
        "amusic-neoforge:amusic-neoforge-1.20.4",
        "amusic-neoforge:amusic-neoforge-1.20.6",
        "amusic-neoforge:amusic-neoforge-1.21.1"
)
include(
        "amusic-fabric:amusic-fabric-1.20.1",
        "amusic-fabric:amusic-fabric-1.20.4",
        "amusic-fabric:amusic-fabric-1.20.6",
        "amusic-fabric:amusic-fabric-1.21.5",
        "amusic-fabric:amusic-fabric-1.21.11"
        // 26.1.2/26.2 require Java 25 toolchain - enable separately when Java 25 available
        // "amusic-fabric:amusic-fabric-26.1.2",
        // "amusic-fabric:amusic-fabric-26.2"
)
