plugins {
    id 'net.minecraftforge.gradle' version '7.0.31'
    id 'net.minecraftforge.renamer' version '1.1.3'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.19.4'
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.19.4-45.0.9')
    implementation project(":amusic-core")
    // Cloth Config API：用于 SettingsScreen 配置界面
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:10.0.126")
}

jar {
    dependsOn(":amusic-core:jar")
}
